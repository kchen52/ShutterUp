name: Build APK

# On-demand sideloadable builds (SPEC §16.1): the owner triggers this from the
# GitHub UI ("Run workflow") and downloads the APK artifact to sideload.

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: release
        type: choice
        options: [release, debug]
      create_release:
        description: "Attach the APK to a GitHub Release"
        required: false
        default: false
        type: boolean
  push:
    tags: ["v*"]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Every CI APK is installable over the previous one (SPEC §16.1).
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Decode release keystore
        # One-time owner setup (SPEC §16.1): repo Settings → Secrets and variables
        # → Actions must hold ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
        # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Until then the release path
        # falls back to a debug-signed APK with a warning (see app/build.gradle.kts).
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            {
              echo "SHUTTERUP_KEYSTORE_PATH=${RUNNER_TEMP}/release.jks"
              echo "SHUTTERUP_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              echo "SHUTTERUP_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
              echo "SHUTTERUP_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
            } >> "$GITHUB_ENV"
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 secret absent; release will be debug-signed."
          fi
      - name: Assemble APK
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug
          else
            ./gradlew assembleRelease
          fi
      - name: Build AAB (release path, for future Play use)
        if: ${{ inputs.build_type != 'debug' }}
        run: ./gradlew bundleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shutterup-${{ inputs.build_type || 'release' }}-${{ github.sha }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          retention-days: 30
      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: |
            app/build/outputs/apk/**/*.apk
